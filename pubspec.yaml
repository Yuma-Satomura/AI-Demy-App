name: ai_demy_app
description: "AI-Demy — 次世代AIラーニングプラットフォーム"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

# 実際に使っているものだけを入れる方針。
# 未使用の依存はビルド時間・APKサイズを増やすうえ、壊れたバージョンを
# 引き込んでビルドを止めることがある（record 5.x で実際に発生）。
# 機能を実装するときに下の「将来の機能で追加するもの」から戻すこと。
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Supabase
  supabase_flutter: ^2.9.0

  # Navigation
  go_router: ^15.1.2

  # State management
  flutter_riverpod: ^2.6.1

  # HTTP & API（自社 Web API 呼び出し）
  http: ^1.4.0

  # UI
  google_fonts: ^6.2.1

  # Payments
  flutter_stripe: ^13.0.0

  # Utils
  url_launcher: ^6.3.1

# 将来の機能で追加するもの（ウェブ版には実装済み・Flutter未実装）
#   動画レッスン          : video_player, chewie
#   音声会話 / 発音練習    : record（7.x以上）, just_audio, permission_handler
#   OJT写真アップロード    : image_picker, permission_handler
#   Markdown教材表示      : flutter_markdown
#   サムネイル画像        : cached_network_image, shimmer
#   日時・通貨の書式       : intl
#   Riverpod コード生成    : riverpod_annotation + riverpod_generator + build_runner
#   環境変数の型安全化     : envied + envied_generator

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
