name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: 静的解析 + テスト
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 依存関係の取得
        run: flutter pub get

      - name: 静的解析
        run: flutter analyze

      - name: テスト（カバレッジ付き）
        run: flutter test --coverage

      - name: カバレッジをアップロード
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: warn
